<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Aced — Onboarding</title>
<link rel="preconnect" href="https://api.fontshare.com" />
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@700,600,500&f[]=satoshi@700,500,400&display=swap" rel="stylesheet" />
<style>
:root {
  --accent: #6c63ff;
  --accent-d: #5040e8;
  --accent-l: #7c6dfa;
  --bg: #080810;
  --surf: rgba(255,255,255,0.025);
  --text: #f0f0f8;
  --t2: rgba(255,255,255,0.50);
  --t3: rgba(255,255,255,0.25);
  --t4: rgba(255,255,255,0.15);
  --bd: rgba(255,255,255,0.08);
  --bd2: rgba(255,255,255,0.12);
  --inset: inset 0 1px 0 rgba(255,255,255,0.06);
  --fd: 'Clash Display','Helvetica Neue',sans-serif;
  --fb: 'Satoshi','Helvetica Neue',sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  overflow: hidden; background: #04040c;
  color: var(--text); font-family: var(--fb);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01","cv01";
}
#root { width: 100%; height: 100%; }

/* ── Stage ── */
.stage {
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(ellipse 900px 700px at 35% 30%, rgba(108,99,255,0.09), transparent 55%),
    radial-gradient(ellipse 600px 450px at 78% 70%, rgba(20,184,166,0.05), transparent),
    #04040c;
}

/* ── Phone frame ── */
.phone {
  width: 390px; height: 844px;
  background: var(--bg); border-radius: 44px;
  overflow: hidden; position: relative;
  display: flex; flex-direction: column;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.07),
    0 40px 100px rgba(0,0,0,0.55),
    0 0 100px rgba(108,99,255,0.05);
}
@media (max-width: 440px) {
  .stage { background: var(--bg); }
  .phone { width: 100vw; height: 100svh; border-radius: 0; box-shadow: none; }
}

/* ── Screen transitions ── */
.screen-inner {
  flex: 1; display: flex; flex-direction: column;
  min-height: 0; position: relative; overflow: hidden;
}
@keyframes sfwd { from { opacity:0; transform:translateX(28px); } to { opacity:1; transform:translateX(0); } }
@keyframes sbk  { from { opacity:0; transform:translateX(-28px); } to { opacity:1; transform:translateX(0); } }
.efwd { animation: sfwd 220ms cubic-bezier(0.4,0,0.2,1) both; }
.ebk  { animation: sbk  220ms cubic-bezier(0.4,0,0.2,1) both; }

/* ── Scroll ── */
.scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 20px 22px 6px;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.scroll::-webkit-scrollbar { display: none; }

/* ── Footer ── */
.footer {
  padding: 12px 22px max(28px, env(safe-area-inset-bottom,28px));
  flex-shrink: 0;
  background: linear-gradient(to bottom, transparent, rgba(8,8,16,0.7) 30%, var(--bg));
}

/* ── Primary button ── */
.btn-p {
  width: 100%; height: 52px; border-radius: 12px;
  background: linear-gradient(135deg, #7c6dfa 0%, #5040e8 100%);
  border: none; color: #fff;
  font-family: var(--fd); font-size: 16px; font-weight: 600;
  letter-spacing: -0.01em; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  position: relative; overflow: hidden;
  transition: transform 0.12s ease, opacity 0.2s;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.btn-p::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.14) 50%, transparent 100%);
  transform: translateX(-120%); pointer-events: none;
}
.btn-p:not(:disabled):hover::after { animation: bsh 600ms ease-out forwards; }
.btn-p:not(:disabled):active { transform: scale(0.98); }
.btn-p:disabled { opacity: 0.35; cursor: not-allowed; }
@keyframes bsh { from { transform:translateX(-120%); } to { transform:translateX(120%); } }

/* ── Option card ── */
.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: var(--inset);
  border-radius: 16px;
  cursor: pointer; color: var(--text);
  font-family: var(--fb); text-align: left;
  transition:
    background 200ms cubic-bezier(0.4,0,0.2,1),
    border-color 200ms cubic-bezier(0.4,0,0.2,1),
    box-shadow 200ms cubic-bezier(0.4,0,0.2,1),
    transform 120ms ease-out;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.card:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.13); }
.card.sel {
  background: rgba(108,99,255,0.12);
  border: 1.5px solid rgba(108,99,255,0.80);
  box-shadow: 0 0 0 4px rgba(108,99,255,0.10), var(--inset);
}
.card:active:not(.sel) { transform: scale(0.98); }

/* ── Pill input ── */
.inp {
  width: 100%; height: 48px; border-radius: 100px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.05);
  color: var(--text); font-family: var(--fb);
  font-size: 15px; font-weight: 400;
  padding: 0 48px 0 20px; outline: none;
  transition: border-color 0.18s, box-shadow 0.18s;
  caret-color: var(--accent);
}
.inp:focus { border-color: rgba(108,99,255,0.6); box-shadow: 0 0 0 3px rgba(108,99,255,0.12); }
.inp::placeholder { color: var(--t3); }

/* ── Back button ── */
.back-btn {
  background: rgba(255,255,255,0.04); border: 1px solid var(--bd);
  border-radius: 8px; color: var(--t2);
  font-family: var(--fb); font-size: 12px; font-weight: 500;
  padding: 5px 9px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 3px;
  transition: all 0.15s; -webkit-tap-highlight-color: transparent;
}
.back-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }

/* ── Step pulse ── */
@keyframes pulse {
  0%,100% { box-shadow: 0 0 6px rgba(108,99,255,0.6); }
  50%      { box-shadow: 0 0 14px rgba(108,99,255,1.0); }
}

/* ── Block appear ── */
@keyframes bapp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.wblk { animation: bapp 280ms ease-out both; }

/* ── Sweep line ── */
@keyframes swp {
  0%   { transform: scaleX(0); opacity: 1; }
  65%  { transform: scaleX(1); opacity: 1; }
  100% { transform: scaleX(1); opacity: 0; }
}

/* ── Aurora drift ── */
@keyframes drift {
  0%,100% { transform: scale(1) translateY(0); }
  50%     { transform: scale(1.05) translateY(-8px); }
}

/* ── Reveal up ── */
@keyframes rup { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }

/* ── Calendar ── */
.cal-pop {
  position: absolute; bottom: calc(100% + 6px); right: 0;
  width: 236px; background: #181826;
  border: 1px solid var(--bd2); border-radius: 14px;
  padding: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.65);
  z-index: 100;
}

/* ── Toast ── */
@keyframes tpop {
  0%   { opacity:0; transform:translate(-50%,8px) scale(0.94); }
  12%  { opacity:1; transform:translate(-50%,0) scale(1); }
  75%  { opacity:1; transform:translate(-50%,0) scale(1); }
  100% { opacity:0; transform:translate(-50%,-4px) scale(0.97); }
}
.toast {
  position: absolute; bottom: 80px; left: 50%;
  transform: translateX(-50%);
  background: rgba(22,22,38,0.95); border: 1px solid var(--bd2);
  color: var(--text); font-family: var(--fb); font-size: 13px;
  padding: 9px 18px; border-radius: 100px;
  z-index: 200; white-space: nowrap; pointer-events: none;
  animation: tpop 2.2s ease-out forwards;
  backdrop-filter: blur(20px);
}

/* ── Tweaks panel ── */
.tweaks {
  position: fixed; bottom: 24px; right: 24px;
  width: 256px; background: #111122;
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 16px; padding: 16px;
  z-index: 9999; box-shadow: 0 30px 80px rgba(0,0,0,0.65);
  font-family: var(--fb); color: var(--text);
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ── Defaults ─────────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#6c63ff",
  "animSpeed": "normal",
  "showSparkles": true
}/*EDITMODE-END*/;

/* ── Subject palette ──────────────────────────────────── */
const PAL = [
  { hex:'#2dd4bf', rgb:'45,212,191'  },
  { hex:'#6c63ff', rgb:'108,99,255'  },
  { hex:'#f59e0b', rgb:'245,158,11'  },
  { hex:'#f472b6', rgb:'244,114,182' },
  { hex:'#34d399', rgb:'52,211,153'  },
  { hex:'#60a5fa', rgb:'96,165,250'  },
  { hex:'#fb923c', rgb:'251,146,60'  },
  { hex:'#c084fc', rgb:'192,132,252' },
];

/* ── Icons ────────────────────────────────────────────── */
const S = ({ d, ...p }) => <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.55" strokeLinecap="round" strokeLinejoin="round" {...p}><path d={d} /></svg>;

const Ic = {
  HighSchool: () => <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.55" strokeLinecap="round" strokeLinejoin="round"><path d="M6 8V5a4 4 0 018 0v3"/><rect x="2" y="8" width="16" height="10" rx="2.5"/><path d="M2 12h16M7 12v2.5a3 3 0 006 0V12"/></svg>,
  College:    () => <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.55" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14M7 4V2M13 4V2M7 12h6M7 15h4"/></svg>,
  Uni:        () => <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.55" strokeLinecap="round" strokeLinejoin="round"><path d="M10 2L2 7l8 4 8-4-8-5z"/><path d="M4 9v4.5c0 1.5 2.7 2.5 6 2.5s6-1 6-2.5V9"/><path d="M18 7v5"/></svg>,
  Self:       () => <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.55" strokeLinecap="round" strokeLinejoin="round"><path d="M11.5 2L4 12h6l-1.5 6L17 8h-6l1.5-6z"/></svg>,
  Plus:       () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M7 2v10M2 7h10"/></svg>,
  X:          () => <svg width="8" height="8" viewBox="0 0 10 10" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M2 2l6 6M8 2l-6 6"/></svg>,
  ChevL:      () => <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M8 2L4 6l4 4"/></svg>,
  Arrow:      () => <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 8h10M9 5l4 3-4 3"/></svg>,
  Cal:        () => <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="3" width="12" height="10" rx="2"/><path d="M1 6h12M4.5 2v2M9.5 2v2"/></svg>,
  Share:      () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M7 1.5v8M4.5 4L7 1.5 9.5 4M2 8.5v2.5a1 1 0 001 1h8a1 1 0 001-1V8.5"/></svg>,
  Spark:      ({ s=11 }) => <svg width={s} height={s} viewBox="0 0 12 12" fill="currentColor"><path d="M6 0l1.35 4.05L12 6l-4.65 1.95L6 12 4.65 7.95 0 6l4.65-1.95z"/></svg>,
  Morning:    () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3l-1.4-1.4M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/><circle cx="12" cy="12" r="4"/><path d="M3 20h18"/></svg>,
  Night:      () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><path d="M21 12.8A9 9 0 0111.2 3a9 9 0 109.8 9.8z"/></svg>,
  Flex:       () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M13 2L5 14h6l-2 8 10-12h-6l2-8z"/></svg>,
};

/* ── Step indicator ───────────────────────────────────── */
function Steps({ current, total = 5 }) {
  const isLast = current === total - 1;
  return (
    <div style={{ display:'flex', gap:5, alignItems:'center' }}>
      {Array.from({ length: total }).map((_, i) => (
        <div key={i} style={{
          width: 28, height: 3, borderRadius: 2,
          background: i === current ? 'var(--accent)' : i < current ? 'rgba(108,99,255,0.45)' : 'rgba(255,255,255,0.15)',
          animation: i === current ? `pulse ${isLast ? '1.4s' : '2s'} ease-in-out infinite` : 'none',
          transition: 'background 0.35s ease',
        }} />
      ))}
    </div>
  );
}

/* ── Top bar ──────────────────────────────────────────── */
function TopBar({ step, onBack }) {
  return (
    <div style={{
      display:'flex', alignItems:'center', justifyContent:'space-between',
      padding:'50px 22px 0', flexShrink: 0,
    }}>
      <div style={{ display:'flex', alignItems:'center', gap:10 }}>
        {step > 0 && (
          <button className="back-btn" onClick={onBack}>
            <Ic.ChevL /> Back
          </button>
        )}
        <div style={{
          fontFamily:'var(--fd)', fontSize:20, fontWeight:700,
          color:'var(--accent)', letterSpacing:'-0.02em', lineHeight:1,
        }}>Aced</div>
      </div>
      <Steps current={step} />
    </div>
  );
}

/* ── Eyebrow label ────────────────────────────────────── */
function Eyebrow({ children }) {
  return (
    <div style={{
      fontFamily:'var(--fb)', fontSize:11, fontWeight:500,
      letterSpacing:'0.18em', textTransform:'uppercase',
      color:'rgba(255,255,255,0.35)', marginTop:26,
    }}>{children}</div>
  );
}

/* ── Heading ──────────────────────────────────────────── */
function H({ children, size=30, style={} }) {
  return (
    <h1 style={{
      fontFamily:'var(--fd)', fontSize:size, fontWeight:700,
      letterSpacing:'-0.03em', lineHeight:1.08, color:'#f0f0f8',
      marginTop:8, ...style,
    }}>{children}</h1>
  );
}

/* ── Sub ──────────────────────────────────────────────── */
function Sub({ children }) {
  return <p style={{ fontFamily:'var(--fb)', fontSize:15, color:'var(--t2)', marginTop:6, lineHeight:1.45 }}>{children}</p>;
}

/* ══════════════════════════════════════════════════════
   SCREEN 1 — Level
══════════════════════════════════════════════════════ */
const LEVELS = [
  { id:'hs',  label:'High School', sub:'Ages 14–18',              I: Ic.HighSchool },
  { id:'col', label:'College',     sub:'Ages 16–19',              I: Ic.College    },
  { id:'uni', label:'University',  sub:'Undergrad & postgrad',    I: Ic.Uni        },
  { id:'slf', label:'Self-Study',  sub:'Bootcamp, IB, vocational',I: Ic.Self       },
];

function S1({ data, setData, onNext }) {
  return (
    <>
      <div className="scroll">
        <Eyebrow>Step 01 · About you</Eyebrow>
        <H size={36} style={{ letterSpacing:'-0.035em', lineHeight:1.05, marginTop:8 }}>Let's build your week.</H>
        <Sub>What are you studying?</Sub>

        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginTop:28 }}>
          {LEVELS.map(l => {
            const sel = data.level === l.id;
            return (
              <button
                key={l.id}
                className={`card${sel ? ' sel' : ''}`}
                style={{ padding:20, minHeight:112, display:'flex', flexDirection:'column' }}
                onClick={() => setData(d => ({ ...d, level: l.id }))}
              >
                <div style={{
                  width:36, height:36, borderRadius:10, flexShrink:0,
                  background: sel ? 'var(--accent)' : 'rgba(255,255,255,0.07)',
                  display:'flex', alignItems:'center', justifyContent:'center',
                  color: sel ? '#fff' : 'rgba(255,255,255,0.60)',
                  transition:'background 200ms, color 200ms',
                }}>
                  <l.I />
                </div>
                <div style={{ fontFamily:'var(--fd)', fontSize:16, fontWeight:600, color:'#fff', marginTop:14, lineHeight:1.1 }}>{l.label}</div>
                <div style={{ fontFamily:'var(--fb)', fontSize:13, color:'rgba(255,255,255,0.40)', marginTop:5, lineHeight:1.3 }}>{l.sub}</div>
              </button>
            );
          })}
        </div>
      </div>

      <div className="footer">
        <div style={{
          opacity: data.level ? 1 : 0,
          transform: data.level ? 'translateY(0)' : 'translateY(6px)',
          transition: 'opacity 300ms ease-out, transform 300ms ease-out',
          pointerEvents: data.level ? 'auto' : 'none',
        }}>
          <button className="btn-p" onClick={onNext}>Continue <Ic.Arrow /></button>
        </div>
        {!data.level && <div style={{ height:52 }} />}
      </div>
    </>
  );
}

/* ══════════════════════════════════════════════════════
   SCREEN 2 — Subjects
══════════════════════════════════════════════════════ */
function S2({ data, setData, onNext }) {
  const [draft, setDraft] = useState('');
  const [removing, setRemoving] = useState(null);
  const inputRef = useRef(null);

  const nextIdx = () => {
    const used = data.subjects.map(s => s.ci);
    for (let i = 0; i < PAL.length; i++) if (!used.includes(i)) return i;
    return data.subjects.length % PAL.length;
  };

  const add = (name) => {
    const n = (name ?? draft).trim();
    if (!n || data.subjects.length >= 8) return;
    setData(d => ({ ...d, subjects: [...d.subjects, { id: Date.now() + Math.random(), name: n, ci: nextIdx(), date: null }] }));
    if (!name) { setDraft(''); inputRef.current?.focus(); }
  };

  const remove = (id) => {
    setRemoving(id);
    setTimeout(() => { setData(d => ({ ...d, subjects: d.subjects.filter(s => s.id !== id) })); setRemoving(null); }, 160);
  };

  const suggestions = useMemo(() => {
    const have = data.subjects.map(s => s.name.toLowerCase());
    const pools = { hs:['Chemistry','Geography','French','Art','Drama'], col:['Physics','Chemistry','Economics','Psychology','Media'], uni:['Statistics','Linear Algebra','Programming','Macro','Ethics'], slf:['Python','Design','Spanish','Marketing','Philosophy'] };
    return (pools[data.level] || pools.col).filter(s => !have.includes(s.toLowerCase())).slice(0,3);
  }, [data.level, data.subjects]);

  return (
    <>
      <div className="scroll">
        <Eyebrow>Step 02 · Subjects</Eyebrow>
        <H>What subjects are you taking?</H>
        <Sub>Add as many as you need.</Sub>

        <div style={{ marginTop:22, position:'relative' }}>
          <input
            ref={inputRef}
            className="inp"
            placeholder="e.g. Biology"
            value={draft}
            onChange={e => setDraft(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && add()}
          />
          <button
            onClick={() => add()}
            disabled={!draft.trim() || data.subjects.length >= 8}
            style={{
              position:'absolute', right:8, top:'50%', transform:'translateY(-50%)',
              width:32, height:32, borderRadius:'50%',
              background: draft.trim() ? 'var(--accent)' : 'rgba(255,255,255,0.08)',
              border:'none', color:'#fff', cursor: draft.trim() ? 'pointer' : 'default',
              display:'flex', alignItems:'center', justifyContent:'center',
              transition:'background 0.18s',
            }}
          ><Ic.Plus /></button>
        </div>

        {suggestions.length > 0 && (
          <div style={{ marginTop:12 }}>
            <div style={{ fontSize:10, color:'rgba(108,99,255,0.75)', fontFamily:'var(--fb)', fontWeight:500, letterSpacing:'0.1em', textTransform:'uppercase', marginBottom:8, display:'flex', alignItems:'center', gap:5 }}>
              <Ic.Spark s={8} /> Suggested
            </div>
            <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
              {suggestions.map(s => (
                <button key={s} onClick={() => add(s)} style={{
                  background:'rgba(108,99,255,0.08)', border:'1px dashed rgba(108,99,255,0.35)',
                  color:'rgba(139,133,255,0.9)', padding:'5px 11px',
                  borderRadius:100, fontSize:12, fontWeight:500, cursor:'pointer',
                  fontFamily:'var(--fb)', whiteSpace:'nowrap',
                }}>+ {s}</button>

const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ML = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function fmtDate(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  return `${d.getDate()} ${MN[d.getMonth()]}`;
}

function MiniCal({ subj, value, onPick, onClose }) {
  const c = PAL[subj.ci % PAL.length];
  const init = value ? new Date(value) : new Date(2026, 5, 1);
  const [vm, setVm] = useState({ y: init.getFullYear(), m: init.getMonth() });
  const first = new Date(vm.y, vm.m, 1);
  const dim = new Date(vm.y, vm.m + 1, 0).getDate();
  const startDow = (first.getDay() + 6) % 7;
  const cells = [...Array(startDow).fill(null), ...Array.from({ length: dim }, (_, i) => i + 1)];
  const selStr = value ? new Date(value).toDateString() : '';
  const prev = () => setVm(({ y, m }) => m === 0 ? { y: y-1, m:11 } : { y, m: m-1 });
  const next = () => setVm(({ y, m }) => m === 11 ? { y: y+1, m:0 } : { y, m: m+1 });

  return (
    <div className="cal-pop" onClick={e => e.stopPropagation()}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
        <button onClick={prev} style={{ background:'none', border:'none', color:'var(--t2)', cursor:'pointer', padding:4, display:'flex' }}><Ic.ChevL /></button>
        <div style={{ fontFamily:'var(--fb)', fontSize:13, fontWeight:500 }}>{ML[vm.m]} {vm.y}</div>
        <button onClick={next} style={{ background:'none', border:'none', color:'var(--t2)', cursor:'pointer', padding:4, display:'flex', transform:'rotate(180deg)' }}><Ic.ChevL /></button>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:1 }}>
        {['M','T','W','T','F','S','S'].map((d,i) => (
          <div key={i} style={{ textAlign:'center', fontSize:10, color:'var(--t3)', fontFamily:'var(--fb)', padding:'3px 0', letterSpacing:'0.05em' }}>{d}</div>
        ))}
        {cells.map((d, i) => {
          if (d === null) return <div key={i} />;
          const date = new Date(vm.y, vm.m, d);
          const isSel = date.toDateString() === selStr;
          return (
            <div key={i} onClick={() => { onPick(date.toISOString()); onClose(); }} style={{
              textAlign:'center', fontSize:12, fontFamily:'var(--fb)',
              padding:'5px 0', borderRadius:6, cursor:'pointer',
              background: isSel ? c.hex : 'transparent',
              color: isSel ? '#fff' : 'var(--text)',
              fontWeight: isSel ? 700 : 400,
              transition:'background 0.12s',
            }}>{d}</div>
          );
        })}
      </div>
    </div>
  );
}

const STYLES = [
  { id:'morning', label:'Morning Person', sub:'6–11am peak',       I: Ic.Morning },
  { id:'night',   label:'Night Owl',      sub:'8pm–1am peak',      I: Ic.Night   },
  { id:'flex',    label:'Flexible',       sub:'Wherever it fits',  I: Ic.Flex    },
];

function S4({ data, setData, onGenerate }) {
  const trackRef = useRef(null);
  const dragging = useRef(false);
  const pct = ((data.hours - 1) / 39) * 100;

  const setH = clientX => {
    const r = trackRef.current?.getBoundingClientRect();
    if (!r) return;
    const t = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
    setData(d => ({ ...d, hours: Math.max(1, Math.min(40, Math.round(1 + t * 39))) }));
  };

  useEffect(() => {
    const mv = e => { if (dragging.current) setH(e.clientX ?? e.touches?.[0]?.clientX); };
    const up = () => { dragging.current = false; };
    window.addEventListener('mousemove', mv);
    window.addEventListener('touchmove', mv, { passive: true });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
    return () => {
      window.removeEventListener('mousemove', mv);
      window.removeEventListener('touchmove', mv);
      window.removeEventListener('mouseup', up);
      window.removeEventListener('touchend', up);
    };
  }, []);

  const trackBg = `linear-gradient(90deg, var(--accent) ${pct}%, rgba(255,255,255,0.10) ${pct}%)`;

  return (
    <>
      <div className="scroll">
        <Eyebrow>Step 04 · Rhythm</Eyebrow>
        <H>When do you work best?</H>
        <Sub>We'll schedule study during your sharpest hours.</Sub>

          {STYLES.map(s => {
            const sel = data.style === s.id;
            return (
              <button
                key={s.id}
                className={`card${sel ? ' sel' : ''}`}
                style={{ display:'flex', alignItems:'center', gap:14, padding:'0 18px', height:72 }}
                onClick={() => setData(d => ({ ...d, style: s.id }))}
              >
                <div style={{
                  width:44, height:44, borderRadius:'50%', flexShrink:0,
                  background: sel ? 'var(--accent)' : 'rgba(255,255,255,0.06)',
                  display:'flex', alignItems:'center', justifyContent:'center',
                  color: sel ? '#fff' : 'rgba(255,255,255,0.55)',
                  transition:'background 200ms, color 200ms',
                }}><s.I /></div>
                <div style={{ flex:1, textAlign:'left' }}>
                  <div style={{ fontFamily:'var(--fd)', fontSize:16, fontWeight:600, color:'#fff' }}>{s.label}</div>
                  <div style={{ fontFamily:'var(--fb)', fontSize:13, color:'var(--t3)', marginTop:3 }}>{s.sub}</div>
                </div>
                <div style={{
                  width:20, height:20, borderRadius:'50%',
                  border: sel ? '6px solid var(--accent)' : '1.5px solid rgba(255,255,255,0.18)',
                  background: sel ? '#fff' : 'transparent',
                  transition:'all 0.18s', flexShrink:0,
                }} />
              </button>
            );
          })}
        </div>

        <div style={{ marginTop:30 }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14 }}>
            <div style={{ fontFamily:'var(--fb)', fontSize:13, fontWeight:500, letterSpacing:'0.10em', textTransform:'uppercase', color:'var(--t2)' }}>Weekly study hours</div>
            <div style={{ fontFamily:'var(--fd)', fontSize:22, fontWeight:700, color:'var(--accent)', letterSpacing:'-0.02em' }}>{data.hours} hrs / week</div>
          </div>
          <div
            ref={trackRef}
            style={{ position:'relative', height:4, borderRadius:100, background:trackBg, cursor:'pointer' }}
            onMouseDown={e => { dragging.current = true; setH(e.clientX); }}
            onTouchStart={e => { dragging.current = true; setH(e.touches[0].clientX); }}
          >
            <div style={{
              position:'absolute', top:'50%', left:`${pct}%`,
              transform:'translate(-50%,-50%)',
              width:22, height:22, borderRadius:'50%',
              background:'var(--accent)',
              boxShadow:'0 0 0 4px rgba(108,99,255,0.25), 0 2px 8px rgba(0,0,0,0.3)',
              display:'flex', alignItems:'center', justifyContent:'center',
              cursor:'grab', userSelect:'none',
            }}>
              <div style={{ width:8, height:8, borderRadius:'50%', background:'#fff' }} />
            </div>
          </div>
          <div style={{ display:'flex', justifyContent:'space-between', marginTop:8, fontFamily:'var(--fb)', fontSize:11, color:'var(--t3)' }}>
            {['1','10','20','30','40'].map(n => <span key={n}>{n}</span>)}
          </div>
        </div>
      </div>

      <div className="footer">
        <button className="btn-p" disabled={!data.style} onClick={onGenerate}>
          <Ic.Spark s={11} /> Generate my week
        </button>
      </div>
    </>
  );
}

/* Static schedule per spec. Global indices determine stagger. */
const SCHED = [
  { day:'Mon', blocks:[{ s:'bio', time:'4–5:30pm', dur:'90m', gi:0 },{ s:'mat', time:'7–8pm', dur:'60m', gi:1 }] },
  { day:'Tue', blocks:[{ s:'his', time:'4–5pm',    dur:'60m', gi:2 }] },
  { day:'Wed', blocks:[{ s:'bio', time:'5–6:30pm', dur:'90m', gi:3 }] },
  { day:'Thu', blocks:[{ s:'mat', time:'4–5:30pm', dur:'90m', gi:4 }] },
  { day:'Fri', blocks:[{ s:'his', time:'3:30–4:30',dur:'60m', gi:5 }] },
  { day:'Sat', blocks:[{ s:'mat', time:'10–11:30', dur:'90m', gi:6 },{ s:'bio', time:'2–3pm', dur:'60m', gi:7 }] },
  { day:'Sun', blocks:[] },
];
const TOTAL_BLOCKS = 8;
const SWEEP_DELAY = 180 + TOTAL_BLOCKS * 60 + 300; // ms after last block finishes

const DEF_SUBJ = {
  bio: { label:'Biology', hex:'#2dd4bf', rgb:'45,212,191'  },
  mat: { label:'Maths',   hex:'#6c63ff', rgb:'108,99,255'  },
  his: { label:'History', hex:'#f59e0b', rgb:'245,158,11'  },
};

function resolveSubj(userSubjs) {
  const r = { ...DEF_SUBJ };
  ['bio','mat','his'].forEach(k => {
    const kw = k === 'mat' ? 'math' : k === 'bio' ? 'bio' : 'hist';
    const m = userSubjs.find(u => u.name.toLowerCase().includes(kw));
    if (m) { const c = PAL[m.ci % PAL.length]; r[k] = { label: m.name, hex: c.hex, rgb: c.rgb }; }
  });
  return r;
}

function WeekGrid({ subj, rkey, showSparks }) {
  return (
    <div key={rkey} style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4, position:'relative', paddingBottom:2 }}>
      {SCHED.map(day => (
        <div key={day.day}>
          <div style={{
            fontFamily:'var(--fb)', fontSize:10, fontWeight:500, letterSpacing:'0.10em',
            textTransform:'uppercase', color:'var(--t2)', textAlign:'center',
            marginBottom:6, paddingBottom:6,
            borderBottom:'1px solid rgba(255,255,255,0.06)',
          }}>{day.day}</div>

          <div style={{ display:'flex', flexDirection:'column', gap:5 }}>
            {day.blocks.map(b => {
              const s = subj[b.s];
              return (
                <div key={b.gi} className="wblk" style={{ animationDelay:`${180 + b.gi * 60}ms` }}>
                  <div style={{
                    borderRadius:8,
                    borderLeft:`3px solid ${s.hex}`,
                    background:`rgba(${s.rgb},0.16)`,
                    padding:'7px 5px 7px 6px',
                    position:'relative', minHeight:44, overflow:'hidden',
                  }}>
                    {showSparks && (
                      <div style={{ position:'absolute', top:4, right:3, color:s.hex, opacity:0.65, fontSize:9, lineHeight:1 }}>✦</div>
                    )}
                    <div style={{ fontFamily:'var(--fb)', fontSize:10, fontWeight:600, color:'#fff', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', paddingRight:showSparks ? 10 : 2 }}>{s.label}</div>
                    <div style={{ fontFamily:'var(--fb)', fontSize:9, color:'rgba(255,255,255,0.40)', marginTop:3, whiteSpace:'nowrap' }}>{b.dur}</div>
                  </div>
                </div>
              );
            })}

            {day.blocks.length === 0 && (
              <div className="wblk" style={{ animationDelay:`${180 + TOTAL_BLOCKS * 60}ms` }}>
                <div style={{
                  borderRadius:8, border:'1px dashed rgba(255,255,255,0.07)',
                  padding:'7px 4px', minHeight:54,
                  display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:3,
                }}>
                  <span style={{ fontSize:14 }}>🌙</span>
                  <div style={{ fontFamily:'var(--fb)', fontSize:9, color:'var(--t3)', textAlign:'center', lineHeight:1.2 }}>Rest</div>
                </div>
              </div>
            )}
          </div>
        </div>
      ))}

      {/* Completion sweep */}
      <div style={{
        position:'absolute', bottom:-2, left:0,
        width:'100%', height:2,
        background:'linear-gradient(90deg, transparent 0%, rgba(108,99,255,0.8) 30%, rgba(170,165,255,1) 50%, rgba(108,99,255,0.8) 70%, transparent 100%)',
        transformOrigin:'left',
        animation:`swp 450ms ease-out ${SWEEP_DELAY}ms both`,
      }} />
    </div>
  );
}

  });

  useEffect(() => {
    const h = e => {
      if (e.data?.type === '__activate_edit_mode')   setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', h);
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', h);
  }, []);

  useEffect(() => {
    document.documentElement.style.setProperty('--accent', tweaks.accent);
  }, [tweaks.accent]);

  const setTweak = (k, v) => {
    setTweaks(t => ({ ...t, [k]: v }));
    window.parent.postMessage({ type:'__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  const go = n => { setDir(n > step ? 'fwd' : 'bk'); setStep(n); };
  const next = () => go(Math.min(step + 1, 4));
  const back = () => go(Math.max(step - 1, 0));

  const screens = [
    <S1 data={data} setData={setData} onNext={next} />,
    <S2 data={data} setData={setData} onNext={next} />,
    <S3 data={data} setData={setData} onNext={next} />,
    <S4 data={data} setData={setData} onGenerate={next} />,
    <S5 data={data} tweaks={tweaks} onFinish={() => go(0)} />,
  ];

  return (
    <div className="stage">
      <div className="phone">
        <TopBar step={step} onBack={back} />
        <div style={{ flex:1, display:'flex', flexDirection:'column', minHeight:0, overflow:'hidden' }}>
          <div key={step} className={`screen-inner e${dir}`} style={{ flex:1, display:'flex', flexDirection:'column', minHeight:0 }}>
            {screens[step]}
          </div>
        </div>
      </div>

      {tweaksOpen && <TweaksPanel tweaks={tweaks} setTweak={setTweak} step={step} go={go} onClose={() => { setTweaksOpen(false); window.parent.postMessage({ type:'__edit_mode_dismissed' }, '*'); }} />}
    </div>
  );
}

/* ── Tweaks ───────────────────────────────────────────── */
const ACCENTS = [
  { l:'Violet',  v:'#6c63ff' },
  { l:'Indigo',  v:'#4f7af8' },
  { l:'Coral',   v:'#f05a7e' },
  { l:'Emerald', v:'#10b981' },
];

function TweaksPanel({ tweaks, setTweak, step, go, onClose }) {
  return (
    <div className="tweaks">
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14 }}>
        <div style={{ fontFamily:'var(--fd)', fontSize:14, fontWeight:600, letterSpacing:'-0.01em' }}>Tweaks</div>
        <button onClick={onClose} style={{ background:'rgba(255,255,255,0.05)', border:'none', borderRadius:6, width:24, height:24, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', color:'var(--t2)' }}><Ic.X /></button>
      </div>

      <div style={{ marginBottom:14 }}>
        <div style={{ fontFamily:'var(--fb)', fontSize:11, color:'var(--t2)', textTransform:'uppercase', letterSpacing:'0.10em', marginBottom:6 }}>Screen</div>
        <div style={{ display:'flex', gap:4 }}>
          {['01','02','03','04','05'].map((n,i) => (
            <button key={i} onClick={() => go(i)} style={{
              flex:1, height:30, borderRadius:6,
              background: step === i ? tweaks.accent : 'rgba(255,255,255,0.04)',
              border:`1px solid ${step === i ? tweaks.accent : 'rgba(255,255,255,0.07)'}`,
              color: step === i ? '#fff' : 'var(--t2)',
              fontFamily:'var(--fd)', fontSize:12, fontWeight:600, cursor:'pointer',
            }}>{n}</button>
          ))}
        </div>
      </div>

      <div style={{ marginBottom:14 }}>
        <div style={{ fontFamily:'var(--fb)', fontSize:11, color:'var(--t2)', textTransform:'uppercase', letterSpacing:'0.10em', marginBottom:6 }}>Accent</div>
        <div style={{ display:'flex', gap:6 }}>
          {ACCENTS.map(a => (
            <button key={a.v} title={a.l} onClick={() => setTweak('accent', a.v)} style={{
              flex:1, aspectRatio:'1', borderRadius:8, background:a.v,
              border: tweaks.accent === a.v ? '2.5px solid white' : '2.5px solid transparent',
              cursor:'pointer',
              boxShadow: tweaks.accent === a.v ? `0 0 0 2px ${a.v}, 0 4px 12px ${a.v}66` : 'none',
            }} />
          ))}
        </div>
      </div>

      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <div style={{ fontFamily:'var(--fb)', fontSize:13, color:'var(--t2)' }}>AI sparkles ✦</div>
        <button onClick={() => setTweak('showSparkles', !tweaks.showSparkles)} style={{
          width:40, height:24, borderRadius:12,
          background: tweaks.showSparkles ? tweaks.accent : 'rgba(255,255,255,0.10)',
          border:'none', cursor:'pointer', position:'relative', transition:'background 0.2s',
        }}>
          <div style={{
            position:'absolute', top:3, left: tweaks.showSparkles ? 19 : 3,
            width:18, height:18, borderRadius:'50%', background:'#fff',
            transition:'left 0.2s',
          }} />
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
