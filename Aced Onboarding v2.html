<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Aced — Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --accent:#6C63FF;--accent-d:#4F46E5;--accent-l:#8B84FF;
  --bg:#FAFAFE;--bg2:#FFFFFF;--bg3:#F0EEFF;
  --text:#1C1640;--t2:#5C5790;--t3:#9B97C4;--t4:#CCC9E8;
  --bd:rgba(108,99,255,.14);--bd2:rgba(108,99,255,.45);
  --shadow-sm:0 1px 6px rgba(91,80,214,.07);
  --shadow:0 4px 16px rgba(91,80,214,.11);
  --f:'Plus Jakarta Sans','Helvetica Neue',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#EDE9FE;color:var(--text);font-family:var(--f);-webkit-font-smoothing:antialiased;overflow:hidden}
#root{width:100%;height:100%;display:flex;flex-direction:column}

/* ── Devbar ── */
.devbar{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 20px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--bd);backdrop-filter:blur(12px);z-index:200}
.devbar-group{display:flex;gap:3px;background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:3px}
.dev-btn{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:7px;border:none;background:transparent;color:var(--t2);font-family:var(--f);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .18s}
.dev-btn:hover{color:var(--text);background:rgba(108,99,255,.07)}
.dev-btn.active{background:rgba(108,99,255,.12);color:var(--accent);border:1px solid rgba(108,99,255,.25)}
.devbar-sep{width:1px;height:18px;background:var(--bd);margin:0 6px}

/* ── Stage ── */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#EDE9FE}
.stage::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(108,99,255,.06) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0}
.blob{position:absolute;pointer-events:none;filter:blur(90px);border-radius:50%}
.blob1{width:55%;height:65%;top:-10%;right:-5%;background:radial-gradient(ellipse,rgba(139,132,255,.25),transparent 70%);animation:drift1 18s ease-in-out infinite}
.blob2{width:45%;height:55%;bottom:-15%;left:-5%;background:radial-gradient(ellipse,rgba(108,99,255,.15),transparent 70%);animation:drift2 22s ease-in-out infinite}
.blob3{width:30%;height:38%;top:38%;left:22%;background:radial-gradient(ellipse,rgba(200,196,255,.20),transparent 70%);animation:drift3 14s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-22px,18px) scale(1.06)}66%{transform:translate(16px,-12px) scale(.95)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(26px,-22px) scale(1.10)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}40%{transform:translate(-16px,20px)}70%{transform:translate(12px,-8px)}}

/* ── Phone frame ── */
.phone{background:var(--bg);display:flex;flex-direction:column;overflow:hidden}

/* ── Device chrome ── */
.chrome-island{height:36px;flex-shrink:0;display:flex;align-items:flex-start;justify-content:center;position:relative}
.chrome-island::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#1C1640;border-radius:0 0 20px 20px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.chrome-dot{height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chrome-dot::after{content:'';width:10px;height:10px;background:#E8E6FF;border-radius:50%;box-shadow:0 0 0 1px rgba(108,99,255,.2)}

/* ── Browser chrome ── */
.browser-bar{background:#F0EEFF;border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.b-dots{display:flex;gap:5px}
.b-dot{width:10px;height:10px;border-radius:50%}
.b-url{flex:1;height:26px;border-radius:6px;background:#fff;border:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;font-family:var(--f);font-size:11px;color:var(--t2);gap:5px}

/* ── Topbar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px 0;flex-shrink:0}

/* ── Screen transitions ── */
@keyframes sfwd{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes sbk{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
.efwd{animation:sfwd 240ms cubic-bezier(.4,0,.2,1) both}
.ebk{animation:sbk 240ms cubic-bezier(.4,0,.2,1) both}
.screen-inner{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}

/* ── Scroll ── */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 22px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* ── Footer ── */
.footer{padding:12px 22px 28px;flex-shrink:0;background:linear-gradient(to bottom,transparent,rgba(250,250,254,.92) 28%,var(--bg))}

/* ── Primary button ── */
.btn-p{width:100%;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--accent-l) 0%,var(--accent-d) 100%);border:none;color:#fff;font-family:var(--f);font-size:16px;font-weight:700;letter-spacing:-.01em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,box-shadow .2s;-webkit-tap-highlight-color:transparent;user-select:none;box-shadow:0 4px 20px rgba(108,99,255,.28)}
.btn-p:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(108,99,255,.38)}
.btn-p:not(:disabled):active{transform:scale(.97)}
.btn-p:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}

/* ── Cards ── */
.card{background:var(--bg2);border:1.5px solid var(--bd);border-radius:16px;cursor:pointer;color:var(--text);font-family:var(--f);text-align:left;transition:background .2s,border-color .2s,box-shadow .2s,transform .15s;-webkit-tap-highlight-color:transparent;user-select:none;box-shadow:var(--shadow-sm)}
.card:hover{border-color:rgba(108,99,255,.35);transform:translateY(-2px);box-shadow:var(--shadow)}
.card.sel{background:rgba(108,99,255,.07);border:2px solid var(--accent);box-shadow:0 0 0 4px rgba(108,99,255,.08)}
.card:active:not(.sel){transform:scale(.97)}

/* ── Input ── */
.inp{width:100%;height:48px;border-radius:100px;border:1.5px solid var(--bd);background:var(--bg2);color:var(--text);font-family:var(--f);font-size:15px;font-weight:500;padding:0 48px 0 20px;outline:none;transition:border-color .18s,box-shadow .18s;caret-color:var(--accent)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,.10)}
.inp::placeholder{color:var(--t3)}

/* ── Back btn ── */
.back-btn{background:var(--bg2);border:1.5px solid var(--bd);border-radius:10px;color:var(--t2);font-family:var(--f);font-size:12px;font-weight:600;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .15s;-webkit-tap-highlight-color:transparent;min-height:32px;min-width:44px;box-shadow:var(--shadow-sm)}
.back-btn:hover{background:var(--bg3);border-color:rgba(108,99,255,.3);color:var(--accent)}
.skip-link{text-align:center;font-family:var(--f);font-size:13px;color:var(--t3);padding:10px 0 0;cursor:pointer;display:block;transition:color .15s}
.skip-link:hover{color:var(--t2)}

/* ── Step pulse ── */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}

/* ── Animations ── */
@keyframes chipIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes bapp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes rup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes swp{0%{transform:scaleX(0);opacity:1}65%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes fillBar{0%{transform:scaleX(0)}20%{transform:scaleX(.28)}55%{transform:scaleX(.66)}82%{transform:scaleX(.9)}100%{transform:scaleX(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scalePop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes tpop{0%{opacity:0;transform:translate(-50%,8px) scale(.94)}12%{opacity:1;transform:translate(-50%,0) scale(1)}75%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-4px) scale(.97)}}
.wblk{animation:bapp 280ms ease-out both}

/* ── Calendar popup ── */
.cal-pop{position:absolute;bottom:calc(100% + 8px);left:0;width:240px;background:var(--bg2);border:1.5px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 16px 48px rgba(91,80,214,.16);z-index:100}

/* ── Toast ── */
.toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;font-family:var(--f);font-size:13px;font-weight:600;padding:9px 18px;border-radius:100px;z-index:200;white-space:nowrap;pointer-events:none;animation:tpop 2.2s ease-out forwards}

/* ── Timetable ── */
.tt-outer{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tt-outer::-webkit-scrollbar{display:none}
.tt-cell{width:46px;height:44px;border-radius:10px;border:1.5px solid var(--bd);background:var(--bg2);cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;flex-shrink:0;-webkit-tap-highlight-color:transparent;user-select:none;box-shadow:var(--shadow-sm)}
.tt-cell:hover{background:rgba(108,99,255,.06);border-color:rgba(108,99,255,.35)}
.tt-cell.on{background:rgba(108,99,255,.10);border-color:var(--accent);box-shadow:0 0 0 2px rgba(108,99,255,.12)}

/* ── Activity card ── */
.act-card{background:var(--bg2);border:1.5px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;user-select:none;box-shadow:var(--shadow-sm)}
.act-card:hover{border-color:rgba(108,99,255,.3);transform:translateY(-1px);box-shadow:var(--shadow)}
.act-card.on{background:rgba(108,99,255,.06);border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,.08)}

/* ── Difficulty pills ── */
.diff-pill{flex:1;height:30px;border-radius:8px;border:1.5px solid var(--bd);background:var(--bg);font-family:var(--f);font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .18s;color:var(--t2)}
.diff-pill:hover{border-color:rgba(108,99,255,.3);color:var(--accent)}
.diff-pill.easy-on{background:rgba(16,185,129,.10);border-color:#10B981;color:#059669}
.diff-pill.medium-on{background:rgba(245,158,11,.10);border-color:#F59E0B;color:#D97706}
.diff-pill.hard-on{background:rgba(239,68,68,.10);border-color:#EF4444;color:#DC2626}

/* ── Subject row ── */
.subj-row{background:var(--bg2);border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-sm);animation:chipIn 300ms ease-out both}

/* ── Session pill ── */
.sess-pill{flex:1;height:52px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;user-select:none;box-shadow:var(--shadow-sm)}
.sess-pill:hover{border-color:rgba(108,99,255,.35);background:rgba(108,99,255,.04)}
.sess-pill.on{background:rgba(108,99,255,.08);border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,.08)}

/* ── Grade card ── */
.grade-card{flex:1;padding:12px 6px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;user-select:none;text-align:center;box-shadow:var(--shadow-sm)}
.grade-card:hover{border-color:rgba(108,99,255,.35);background:rgba(108,99,255,.04)}
.grade-card.on{border-color:var(--accent);background:rgba(108,99,255,.08);box-shadow:0 0 0 3px rgba(108,99,255,.08)}

/* ── Notification toggle ── */
.notif-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--bg2);border:1.5px solid var(--bd);border-radius:14px;box-shadow:var(--shadow-sm)}
.toggle-track{width:44px;height:26px;border-radius:13px;position:relative;cursor:pointer;transition:background .2s;-webkit-tap-highlight-color:transparent;border:none;flex-shrink:0}
.toggle-thumb{position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}

/* ── Resume banner ── */
.resume-banner{background:rgba(108,99,255,.06);border:1.5px solid rgba(108,99,255,.25);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;cursor:pointer;transition:all .18s}
.resume-banner:hover{background:rgba(108,99,255,.10);border-color:rgba(108,99,255,.4)}

/* ── Quick pick chip ── */
.qp-chip{padding:6px 13px;border-radius:100px;border:1.5px solid var(--bd);background:var(--bg2);color:var(--t2);font-family:var(--f);font-size:12px;font-weight:600;cursor:pointer;transition:all .18s;box-shadow:var(--shadow-sm)}
.qp-chip:hover{border-color:var(--accent);color:var(--accent);background:rgba(108,99,255,.05)}

/* ── Day toggle btn ── */
.day-toggle{width:100%;height:28px;margin-bottom:4px;border-radius:8px;font-family:var(--f);font-size:10px;font-weight:700;cursor:pointer;transition:all .18s;text-transform:uppercase;letter-spacing:.05em;border:1.5px solid var(--bd);background:var(--bg2);color:var(--t3)}
.day-toggle:hover{border-color:rgba(108,99,255,.35);color:var(--accent)}
.day-toggle.day-on{border-color:var(--accent);background:rgba(108,99,255,.10);color:var(--accent)}

/* ── Real mobile ── */
@media(max-width:480px){.devbar{display:none}}

/* ── Reduced motion ── */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ── Constants ── */
const STORAGE_KEY = 'aced-ob-v4';
const PAL = [
  {hex:'#6C63FF',rgb:'108,99,255'},{hex:'#2dd4bf',rgb:'45,212,191'},
  {hex:'#f59e0b',rgb:'245,158,11'},{hex:'#f472b6',rgb:'244,114,182'},
  {hex:'#34d399',rgb:'52,211,153'},{hex:'#60a5fa',rgb:'96,165,250'},
  {hex:'#fb923c',rgb:'251,146,60'},{hex:'#c084fc',rgb:'192,132,252'},
];
const DEVICES = [
  {id:'iphone', label:'iPhone',  w:390,  h:844, r:44, chrome:'island'},
  {id:'android',label:'Android', w:412,  h:915, r:36, chrome:'dot'},
  {id:'tablet', label:'Tablet',  w:768,  h:680, r:20, chrome:'none'},
  {id:'desktop',label:'Desktop', w:1140, h:720, r:0,  chrome:'browser'},
];
const LEVELS = [
  {id:'hs',  label:'High School',  sub:'Ages 14–18'},
  {id:'col', label:'College',      sub:'Sixth form & A-levels'},
  {id:'uni', label:'University',   sub:'Undergrad & postgrad'},
  {id:'pro', label:'Professional', sub:'Work goals, CPD & projects'},
];
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const SLOTS = [{id:'am',label:'AM',sub:'8–12'},{id:'pm',label:'PM',sub:'12–5'},{id:'eve',label:'Eve',sub:'5–9'}];
const ACT_LIST = [
  {id:'gym',    label:'Exercise',  sub:'Gym, sport & fitness',    defHrs:4},
  {id:'job',    label:'Work',      sub:'Full or part-time job',   defHrs:16},
  {id:'family', label:'Family',    sub:'Kids, caring & home',     defHrs:8},
  {id:'create', label:'Creative',  sub:'Music, art & hobbies',    defHrs:3},
  {id:'social', label:'Social',    sub:'Friends & events',        defHrs:5},
  {id:'travel', label:'Commute',   sub:'Daily travel time',       defHrs:5},
];
const STYLES = [
  {id:'morning',   label:'Morning',   sub:'6am – 12pm'},
  {id:'afternoon', label:'Afternoon', sub:'12pm – 5pm'},
  {id:'evening',   label:'Evening',   sub:'5pm – 9pm'},
  {id:'night',     label:'Night Owl', sub:'9pm – 1am'},
  {id:'flex',      label:'Flexible',  sub:'Any time works'},
];
const SESSION_OPTS = [
  {id:'25',label:'25 min',sub:'Pomodoro'},
  {id:'45',label:'45 min',sub:'Standard'},
  {id:'90',label:'90 min',sub:'Deep focus'},
];
const GRADES = [
  {id:'pass', label:'Pass', sub:'Minimum goal',    col:'#22c55e'},
  {id:'solid',label:'Good', sub:'Solid grade',     col:'#6C63FF'},
  {id:'high', label:'High', sub:'Top performance', col:'#8b5cf6'},
  {id:'first',label:'Best', sub:'Maximum effort',  col:'#f59e0b'},
];
const NOTIF_TIMES = ['7am','8am','9am','6pm','7pm','8pm'];
const DIFF_CYCLE = ['easy','medium','hard'];
const DIFF_CFG = {
  easy:  {dot:'#10B981'},
  medium:{dot:'#F59E0B'},
  hard:  {dot:'#EF4444'},
};
const QUICK_PICKS = [
  {label:'Weekday mornings', apply: b => DAYS.slice(0,5).forEach(d => { b[`${d}-am`] = true; })},
  {label:'Evenings',         apply: b => DAYS.forEach(d => { b[`${d}-eve`] = true; })},
  {label:'Weekends',         apply: b => DAYS.slice(5).forEach(d => SLOTS.forEach(s => { b[`${d}-${s.id}`] = true; }))},
];

/* ── LocalStorage ── */
function loadSaved(){
  try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY));if(s&&s.data)return s;}catch{}return null;
}
function mkDefault(){
  return{
    level:'col',
    subjects:[
      {id:1,name:'Biology', ci:1,date:new Date(2026,5,12).toISOString(),cwDate:null,difficulty:'medium'},
      {id:2,name:'Maths',   ci:2,date:new Date(2026,5,18).toISOString(),cwDate:null,difficulty:'easy'},
      {id:3,name:'History', ci:3,date:new Date(2026,5,5).toISOString(), cwDate:null,difficulty:'hard'},
    ],
    busy:{},
    activities:Object.fromEntries(ACT_LIST.map(a=>[a.id,{on:false,hrs:a.defHrs}])),
    sessionLen:'45',
    style:'morning',
    hours:15,
    targetGrade:'solid',
    notifications:{on:true,time:'8am'},
  };
}

/* ── Dynamic Scheduler ── */
function generateSchedule(data){
  const subjects = data.subjects||[];
  if(!subjects.length) return DAYS.map(d=>({day:d,blocks:[]}));

  const sessionMins = {25:25,45:45,90:90}[data.sessionLen]||45;
  const numSessions = Math.min(16,Math.max(3,Math.round((data.hours||15)*60/sessionMins)));

  // Weight each subject by difficulty × deadline urgency
  const now = Date.now();
  const weighted = subjects.map(s=>{
    const dw = {easy:.6,medium:1.0,hard:1.5}[s.difficulty]||1;
    const dl = [s.date,s.cwDate].filter(Boolean).sort()[0];
    const days = dl ? Math.max(1,(new Date(dl)-now)/86400000) : 60;
    return {...s, w: dw * Math.min(2, 30/days)};
  });

  const wSum = weighted.reduce((a,b)=>a+b.w,0);
  const counts = weighted.map(s=>Math.max(1,Math.round(s.w/wSum*numSessions)));
  // Trim to exact total
  let total = counts.reduce((a,b)=>a+b,0);
  for(let i=0;total>numSessions;i=(i+1)%counts.length){if(counts[i]>1){counts[i]--;total--;}}
  for(let i=0;total<numSessions;i=(i+1)%counts.length){counts[i]++;total++;}

  // Interleave subjects
  const queue=[];
  const max=Math.max(...counts);
  for(let i=0;i<max;i++) weighted.forEach((s,j)=>{if(i<counts[j])queue.push(s);});

  // Determine available slots from user selections
  const sel = data.busy||{};
  const anySel = Object.values(sel).some(Boolean);
  const avail=[];
  DAYS.forEach(day=>SLOTS.forEach(slot=>{
    if(!anySel||sel[`${day}-${slot.id}`]) avail.push({day,slot:slot.id});
  }));
  if(!avail.length) DAYS.forEach(day=>SLOTS.forEach(slot=>avail.push({day,slot:slot.id})));

  // Assign sessions: spread across week
  const result={};
  DAYS.forEach(d=>result[d]=[]);
  queue.forEach((s,i)=>{
    const {day}=avail[i%avail.length];
    const c=PAL[s.ci%PAL.length];
    result[day].push({name:s.name,hex:c.hex,rgb:c.rgb,dur:`${sessionMins}m`});
  });
  return DAYS.map(d=>({day:d,blocks:result[d]}));
}

/* ══ S2 — Subjects + difficulty ══ */
function S2({data,setData,onNext}){
  const [draft,setDraft]=useState('');
  const inputRef=useRef(null);
  const nextIdx=()=>{const used=data.subjects.map(s=>s.ci);for(let i=0;i<PAL.length;i++)if(!used.includes(i))return i;return data.subjects.length%PAL.length;};
  const add=(name)=>{
    const n=(name??draft).trim();
    if(!n||data.subjects.length>=8)return;
    setData(d=>({...d,subjects:[...d.subjects,{id:Date.now()+Math.random(),name:n,ci:nextIdx(),date:null,cwDate:null,difficulty:'medium'}]}));
    if(!name){setDraft('');inputRef.current?.focus();}
  };
  const remove=(id)=>setData(d=>({...d,subjects:d.subjects.filter(s=>s.id!==id)}));
  const setDiff=(id,diff)=>setData(d=>({...d,subjects:d.subjects.map(s=>s.id===id?{...s,difficulty:diff}:s)}));

  const suggestions=useMemo(()=>{
    const have=data.subjects.map(s=>s.name.toLowerCase());
    const pools={
      hs: ['Chemistry','Geography','French','Biology','Art'],
      col:['Physics','Chemistry','Economics','Psychology','Media Studies'],
      uni:['Statistics','Linear Algebra','Computer Science','Macroeconomics','Ethics'],
      pro:['Project Management','Data Analysis','Leadership','Marketing Strategy','Excel / Sheets'],
      slf:['Python','UI Design','Spanish','Marketing','Philosophy'],
    };
    return(pools[data.level]||pools.col).filter(s=>!have.includes(s.toLowerCase())).slice(0,3);
  },[data.level,data.subjects]);

  const placeholder = data.level==='pro' ? 'e.g. AWS Certification' : 'e.g. Biology';

  return(
    <>
      <div className="scroll">
        <Eyebrow>Step 02 · Subjects</Eyebrow>
        <H>What are you<br/>working on?</H>
        <Sub>Add up to 8 subjects or topics, then set how challenging each one is.</Sub>
        <div style={{marginTop:18,position:'relative'}}>
          <input ref={inputRef} className="inp" placeholder={placeholder} value={draft}
            onChange={e=>setDraft(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()}/>
          <button onClick={()=>add()} disabled={!draft.trim()||data.subjects.length>=8}
            style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',width:32,height:32,borderRadius:'50%',background:draft.trim()?'var(--accent)':'var(--bd)',border:'none',color:'#fff',cursor:draft.trim()?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',transition:'background .18s'}}>
            <Ic.Plus/>
          </button>
        </div>
        {suggestions.length>0&&(
          <div style={{marginTop:10}}>
            <div style={{fontSize:10,color:'var(--accent)',fontFamily:'var(--f)',fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',marginBottom:7}}>Suggested</div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              {suggestions.map(s=>(
                <button key={s} onClick={()=>add(s)} style={{background:'rgba(108,99,255,.06)',border:'1.5px dashed rgba(108,99,255,.4)',color:'var(--accent)',padding:'5px 12px',borderRadius:100,fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'var(--f)',whiteSpace:'nowrap',transition:'all .18s'}}>
                  + {s}
                </button>
              ))}
            </div>
          </div>
        )}
        <div style={{marginTop:14,display:'flex',flexDirection:'column',gap:8}}>
          {data.subjects.length===0&&<div style={{color:'var(--t3)',fontSize:13,fontFamily:'var(--f)',paddingTop:4,fontStyle:'italic',fontWeight:500}}>Start typing above…</div>}
          {data.subjects.map((s,i)=>{
            const c=PAL[s.ci%PAL.length];
            return(
              <div key={s.id} className="subj-row" style={{animationDelay:`${i*45}ms`}}>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <div style={{width:10,height:10,borderRadius:'50%',background:c.hex,flexShrink:0}}/>
                  <div style={{fontFamily:'var(--f)',fontSize:14,fontWeight:700,color:'var(--text)',flex:1}}>{s.name}</div>
                  <button onClick={()=>remove(s.id)} style={{width:28,height:28,borderRadius:8,background:'var(--bg3)',border:'1.5px solid var(--bd)',color:'var(--t3)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0,transition:'all .15s'}}>
                    <Ic.X/>
                  </button>
                </div>
                <div style={{display:'flex',gap:6}}>
                  {DIFF_CYCLE.map(d=>(
                    <button key={d} className={`diff-pill${s.difficulty===d?' '+d+'-on':''}`} onClick={()=>setDiff(s.id,d)}>
                      <div style={{width:6,height:6,borderRadius:'50%',background:DIFF_CFG[d].dot,flexShrink:0}}/>
                      {d.charAt(0).toUpperCase()+d.slice(1)}
                    </button>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
        {data.subjects.length>0&&(
          <div style={{marginTop:10,fontFamily:'var(--f)',fontSize:11,color:'var(--t3)',fontWeight:500,lineHeight:1.5}}>
            Difficulty affects how many sessions Aced schedules per subject.
          </div>
        )}
      </div>
      <div className="footer">
        <button className="btn-p" disabled={data.subjects.length===0} onClick={onNext}>Continue <Ic.Arrow/></button>
      </div>
    </>
  );
}

/* ══ S3 — Study Windows ══ */
function S3({data,setData,onNext}){
  const toggle=(day,slot)=>{const k=`${day}-${slot}`;setData(d=>({...d,busy:{...d.busy,[k]:!d.busy[k]}}));};
  const toggleDay=(day)=>{
    const allOn=SLOTS.every(s=>data.busy[`${day}-${s.id}`]);
    setData(d=>{const nb={...d.busy};SLOTS.forEach(s=>{nb[`${day}-${s.id}`]=!allOn;});return{...d,busy:nb};});
  };
  const applyQuickPick=(fn)=>{setData(d=>{const nb={};fn(nb);return{...d,busy:nb};});};
  const selCount=Object.values(data.busy).filter(Boolean).length;
  const CELL_W=46; const GAP=4;
  return(
    <>
      <div className="scroll">
        <Eyebrow>Step 03 · Your schedule</Eyebrow>
        <H>When can you<br/>focus?</H>
        <Sub>Tap the slots you're free to study or work. Aced schedules inside these windows.</Sub>

        {/* Quick picks */}
        <div style={{marginTop:16,display:'flex',gap:7,flexWrap:'wrap'}}>
          {QUICK_PICKS.map(qp=>(
            <button key={qp.label} className="qp-chip" onClick={()=>applyQuickPick(qp.apply)}>{qp.label}</button>
          ))}
          {selCount>0&&(
            <button className="qp-chip" onClick={()=>setData(d=>({...d,busy:{}}))} style={{color:'var(--t3)',borderStyle:'dashed'}}>Clear all</button>
          )}
        </div>

        {/* Grid */}
        <div style={{marginTop:18,display:'flex',gap:6}}>
          {/* Row labels */}
          <div style={{flexShrink:0,width:36}}>
            <div style={{height:32}}/>
            {SLOTS.map(slot=>(
              <div key={slot.id} style={{height:CELL_W+GAP,display:'flex',flexDirection:'column',justifyContent:'center',paddingRight:4}}>
                <div style={{fontFamily:'var(--f)',fontSize:10,fontWeight:700,color:'var(--t2)',lineHeight:1,textAlign:'right'}}>{slot.label}</div>
                <div style={{fontFamily:'var(--f)',fontSize:9,color:'var(--t4)',lineHeight:1,marginTop:1,textAlign:'right',fontWeight:500}}>{slot.sub}</div>
              </div>
            ))}
          </div>
          {/* Scrollable grid */}
          <div className="tt-outer" style={{flex:1}}>
            <div style={{width:`${DAYS.length*(CELL_W+GAP)-GAP}px`}}>
              {/* Day toggles */}
              <div style={{display:'flex',gap:GAP,height:32,alignItems:'center',marginBottom:0}}>
                {DAYS.map(day=>{
                  const allOn=SLOTS.every(s=>data.busy[`${day}-${s.id}`]);
                  return(
                    <button key={day} className={`day-toggle${allOn?' day-on':''}`} style={{width:CELL_W,flexShrink:0}} onClick={()=>toggleDay(day)}>{day}</button>
                  );
                })}
              </div>
              {/* Slot rows */}
              {SLOTS.map(slot=>(
                <div key={slot.id} style={{display:'flex',gap:GAP,marginBottom:GAP}}>
                  {DAYS.map(day=>{
                    const on=!!data.busy[`${day}-${slot.id}`];
                    return(
                      <div key={day} className={`tt-cell${on?' on':''}`} style={{width:CELL_W,flexShrink:0}} onClick={()=>toggle(day,slot.id)}>
                        {on&&<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="var(--accent)" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 7.5l3.5 3.5 6.5-7"/></svg>}
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          </div>
        </div>

        {selCount>0?(
          <div style={{marginTop:14,padding:'10px 14px',background:'rgba(108,99,255,.06)',border:'1.5px solid rgba(108,99,255,.20)',borderRadius:12,display:'flex',gap:8,alignItems:'center',fontFamily:'var(--f)',fontSize:12,color:'var(--t2)',fontWeight:500,animation:'fadeIn 300ms ease-out'}}>
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="var(--accent)" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 7.5l3.5 3.5 6.5-7"/></svg>
            <span><span style={{color:'var(--accent)',fontWeight:700}}>{selCount} window{selCount!==1?'s':''} selected</span> — your schedule fits within these.</span>
          </div>
        ):(
          <div style={{marginTop:14,padding:'10px 14px',background:'var(--bg3)',border:'1.5px solid var(--bd)',borderRadius:12,fontFamily:'var(--f)',fontSize:12,color:'var(--t3)',fontWeight:500}}>
            Nothing selected yet — Aced will find slots across your whole week.
          </div>
        )}
      </div>
      <div className="footer">
        <button className="btn-p" onClick={onNext}>Continue <Ic.Arrow/></button>
        <span className="skip-link" onClick={onNext}>Skip — set this later</span>
      </div>
    </>
  );
}

/* ══ S4 — Deadlines ══ */
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ML=['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtDate(iso){if(!iso)return null;const d=new Date(iso);return `${d.getDate()} ${MN[d.getMonth()]}`;}

function MiniCal({subj,value,onPick,onClose}){
  const c=PAL[subj.ci%PAL.length];
  const init=value?new Date(value):new Date(2026,5,1);
  const [vm,setVm]=useState({y:init.getFullYear(),m:init.getMonth()});

/* ══ S7 — Schedule reveal ══ */
const GEN_PHASES=['Reading your subjects…',null,'Fitting sessions around your week…','Optimising by deadline and difficulty…'];

function S7({data,onFinish}){
  const [phase,setPhase]=useState(0);
  const [done,setDone]=useState(false);
  const [regen,setRegen]=useState(0);
  const [toast,setToast]=useState(null);

  const sched=useMemo(()=>generateSchedule(data),[data,regen]);
  const totalBlocks=sched.reduce((a,d)=>a+d.blocks.length,0);

  const phaseText=useMemo(()=>{
    if(phase===1){return data.subjects.slice(0,3).map(s=>`${s.name} · ${s.difficulty}`).join('  ·  ')+'…';}
    return GEN_PHASES[phase];
  },[phase,data.subjects]);

  useEffect(()=>{
    const timings=[700,900,800,600];
    let i=0;
    const next=()=>{i++;if(i>=4){setTimeout(()=>setDone(true),200);return;}setPhase(i);setTimeout(next,timings[i]);};
    setTimeout(next,timings[0]);
  },[]);

  const breakdown=useMemo(()=>{
    const counts={};const colors={};
    sched.forEach(d=>d.blocks.forEach(b=>{counts[b.name]=(counts[b.name]||0)+1;colors[b.name]=b.hex;}));
    const sm={25:25,45:45,90:90}[data.sessionLen]||45;
    return Object.entries(counts).map(([name,cnt])=>({name,hex:colors[name],cnt,hrs:(cnt*sm/60).toFixed(1)}));
  },[sched,data.sessionLen]);

  const showToast=msg=>{setToast(null);requestAnimationFrame(()=>requestAnimationFrame(()=>setToast(msg)));setTimeout(()=>setToast(null),2200);};

  if(!done){
    return(
      <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'0 32px',position:'relative'}}>
        <div style={{position:'absolute',inset:0,background:'radial-gradient(ellipse 60% 55% at 50% 40%,rgba(108,99,255,.10),transparent 65%)',pointerEvents:'none',animation:'fadeIn 500ms ease-out'}}/>
        <div style={{position:'relative',zIndex:1,width:'100%',maxWidth:280,textAlign:'center'}}>
          <div style={{display:'flex',justifyContent:'center',marginBottom:28}}>
            <AcedLogo size={40} showText={false}/>
          </div>
          <div style={{width:'100%',height:4,borderRadius:100,background:'var(--bd)',overflow:'hidden',marginBottom:18}}>
            <div style={{height:'100%',borderRadius:100,background:'linear-gradient(90deg,var(--accent),var(--accent-l))',transformOrigin:'left',animation:'fillBar 3s cubic-bezier(.4,0,.2,1) forwards',boxShadow:'0 0 12px rgba(108,99,255,.35)'}}/>
          </div>
          <div style={{fontFamily:'var(--f)',fontSize:13,color:'var(--t2)',lineHeight:1.6,minHeight:38,animation:'fadeIn 300ms ease-out',fontWeight:500}}>{phaseText}</div>
        </div>
      </div>
    );
  }

  return(
    <>
      <div className="scroll">
        <h1 style={{fontFamily:'var(--f)',fontSize:34,fontWeight:800,letterSpacing:'-.035em',lineHeight:1.04,color:'var(--text)',marginTop:12,animation:'rup 500ms ease-out 60ms both'}}>Your schedule<br/>is ready.</h1>
        <p style={{fontFamily:'var(--f)',fontSize:13,color:'var(--t2)',marginTop:8,lineHeight:1.55,animation:'rup 400ms ease-out 180ms both',fontWeight:500}}>Built around your deadlines and the time you actually have.</p>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6,marginTop:14,animation:'rup 400ms ease-out 280ms both'}}>
          {[{n:`${totalBlocks}`,l:'Sessions'},{n:`${data.hours}h`,l:'Per week'},{n:`${data.subjects.length}`,l:'Subjects'}].map(({n,l})=>(
            <div key={l} style={{background:'var(--bg2)',border:'1.5px solid var(--bd)',borderRadius:12,padding:'9px 11px',boxShadow:'var(--shadow-sm)'}}>
              <div style={{fontFamily:'var(--f)',fontSize:18,fontWeight:800,color:'var(--text)',letterSpacing:'-.02em',lineHeight:1}}>{n}</div>
              <div style={{fontFamily:'var(--f)',fontSize:10.5,color:'var(--t2)',marginTop:3,fontWeight:600}}>{l}</div>
            </div>
          ))}
        </div>
        <div style={{display:'flex',justifyContent:'flex-end',marginTop:10,marginBottom:7,animation:'rup 300ms ease-out 360ms both'}}>
          <button onClick={()=>{setRegen(k=>k+1);showToast('Regenerated!');}} style={{background:'var(--bg3)',border:'1.5px solid rgba(108,99,255,.25)',color:'var(--accent)',fontFamily:'var(--f)',fontSize:12,fontWeight:700,padding:'6px 13px',borderRadius:100,cursor:'pointer',display:'flex',alignItems:'center',gap:5,transition:'all .18s'}}>
            <Ic.Spark s={9}/> Regenerate
          </button>
        </div>
        <div style={{background:'var(--bg2)',border:'1.5px solid var(--bd)',borderRadius:14,padding:10,animation:'scalePop 400ms cubic-bezier(.34,1.2,.64,1) 440ms both',boxShadow:'var(--shadow-sm)'}}>
          <WeekGrid sched={sched}/>
        </div>
        {breakdown.length>0&&(
          <div style={{marginTop:12,display:'flex',flexDirection:'column',gap:7,animation:'rup 300ms ease-out 600ms both'}}>
            {breakdown.map(s=>(
              <div key={s.name} style={{display:'flex',alignItems:'center',gap:10}}>
                <div style={{display:'flex',alignItems:'center',gap:6,width:80,flexShrink:0}}>
                  <div style={{width:8,height:8,borderRadius:'50%',background:s.hex,flexShrink:0}}/>
                  <div style={{fontFamily:'var(--f)',fontSize:11,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:600}}>{s.name}</div>
                </div>
                <div style={{flex:1,height:4,borderRadius:100,background:'var(--bd)',overflow:'hidden'}}>
                  <div style={{height:'100%',borderRadius:100,background:s.hex,width:`${Math.min(100,(s.cnt/totalBlocks)*100)}%`,opacity:.85}}/>
                </div>
                <div style={{fontFamily:'var(--f)',fontSize:11,color:'var(--t2)',width:52,textAlign:'right',flexShrink:0,fontWeight:600}}>{s.cnt}× · {s.hrs}h</div>
              </div>
            ))}
          </div>
        )}
      </div>
      <div className="footer">
        <button className="btn-p" onClick={onFinish} style={{fontSize:17}}>Let's go <Ic.Arrow/></button>
        <button onClick={()=>{navigator.clipboard?.writeText('https://aced.app/plan/abc123').catch(()=>{});showToast('Link copied!');}} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:6,width:'100%',marginTop:10,background:'none',border:'none',fontFamily:'var(--f)',fontSize:13,color:'var(--t3)',cursor:'pointer',padding:6,fontWeight:600}}>
          <Ic.Share/> Share your plan
        </button>
      </div>
      {toast&&<div className="toast" key={toast+regen}>{toast}</div>}
    </>
  );
}

/* ══ Device bar ══ */
const DEV_ICONS={
  iphone:  ()=><svg width="12" height="16" viewBox="0 0 12 18" fill="none"><rect x=".7" y=".7" width="10.6" height="16.6" rx="3" stroke="currentColor" strokeWidth="1.3"/><rect x="3.5" y="2" width="5" height="1" rx=".5" fill="currentColor" opacity=".5"/></svg>,
  android: ()=><svg width="11" height="16" viewBox="0 0 11 18" fill="none"><rect x=".7" y="1.7" width="9.6" height="14.6" rx="2.5" stroke="currentColor" strokeWidth="1.3"/><circle cx="5.5" cy="14.5" r=".9" fill="currentColor" opacity=".6"/></svg>,
  tablet:  ()=><svg width="20" height="14" viewBox="0 0 22 16" fill="none"><rect x=".7" y=".7" width="20.6" height="14.6" rx="2.5" stroke="currentColor" strokeWidth="1.3"/><circle cx="19" cy="8" r=".8" fill="currentColor" opacity=".5"/></svg>,
  desktop: ()=><svg width="18" height="14" viewBox="0 0 20 16" fill="none"><rect x=".7" y=".7" width="18.6" height="11.6" rx="1.8" stroke="currentColor" strokeWidth="1.3"/><path d="M.7 3.5h18.6M7 15h6M10 12.3v2.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" opacity=".7"/></svg>,
};
function DeviceBar({active,onChange}){
  const dev=DEVICES.find(d=>d.id===active);
  return(
    <div className="devbar">
      <span style={{fontFamily:'var(--f)',fontSize:11,color:'var(--t3)',letterSpacing:'.07em',fontWeight:600,marginRight:2}}>Preview</span>
      <div className="devbar-group">
        {DEVICES.map(d=>{const Icon=DEV_ICONS[d.id];return(
          <button key={d.id} className={`dev-btn${active===d.id?' active':''}`} onClick={()=>onChange(d.id)}>
            <Icon/> {d.label}
          </button>
        );})}
      </div>
      <div className="devbar-sep"/>
      <span style={{fontFamily:'var(--f)',fontSize:11,color:'var(--t3)',letterSpacing:'.06em',fontWeight:600}}>{dev.w} × {dev.h}</span>
    </div>
  );
}

/* ══ Phone frame ══ */
function PhoneFrame({device,children}){
  const dev=DEVICES.find(d=>d.id===device);
  const isDesktop=device==='desktop';
  const chrome=device==='iphone'?<div className="chrome-island"/>:device==='android'?<div className="chrome-dot"/>:null;
  const phoneEl=(
    <div className="phone" style={{width:dev.w,height:isDesktop?dev.h-42:dev.h,borderRadius:isDesktop?'0 0 4px 4px':dev.r}}>
      {chrome}
      {children}
    </div>
  );
  if(isDesktop) return(
    <div style={{width:dev.w,borderRadius:12,overflow:'hidden',boxShadow:'0 0 0 1px rgba(108,99,255,.12),0 0 0 8px rgba(108,99,255,.04),0 0 0 9px rgba(108,99,255,.06),0 50px 120px rgba(91,80,214,.25)'}}>
      <div className="browser-bar">
        <div className="b-dots"><div className="b-dot" style={{background:'#ff5f57'}}/><div className="b-dot" style={{background:'#ffbd2e'}}/><div className="b-dot" style={{background:'#28c840'}}/></div>
        <div className="b-url"><Ic.Lock/> aced.app/onboarding</div>
      </div>
      {phoneEl}
    </div>
  );
  return(
    <div style={{borderRadius:dev.r+2,overflow:'hidden',boxShadow:'0 0 0 1px rgba(108,99,255,.12),0 0 0 8px rgba(108,99,255,.04),0 0 0 9px rgba(108,99,255,.06),0 50px 100px rgba(91,80,214,.22)'}}>
      {phoneEl}
    </div>
  );
}

/* ══ Scale to fit ══ */
function ScaledFrame({device,children}){
  const wrapRef=useRef(null);
  const [scale,setScale]=useState(1);
  const dev=DEVICES.find(d=>d.id===device);
  useEffect(()=>{
    const measure=()=>{
      if(!wrapRef.current)return;
      const{width,height}=wrapRef.current.getBoundingClientRect();
      setScale(Math.min((width-60)/dev.w,(height-60)/dev.h,1));
    };
    measure();
    const ro=new ResizeObserver(measure);
    if(wrapRef.current)ro.observe(wrapRef.current);
    return()=>ro.disconnect();
  },[device,dev.w,dev.h]);
  return(
    <div ref={wrapRef} className="stage">
      <div className="blob blob1"/><div className="blob blob2"/><div className="blob blob3"/>
      <div style={{transform:`scale(${scale})`,transformOrigin:'center center',position:'relative',zIndex:1}}>
        {children}
      </div>
    </div>
  );
}

/* ══ APP ══ */
function App(){
  const saved=useMemo(()=>loadSaved(),[]);
  const [step,setStep]=useState(saved?.step??0);
  const [data,setData]=useState(()=>{
    const d=saved?.data??mkDefault();
    // migrate old 'sport' activity to 'family' if needed
    if(d.activities&&d.activities.sport&&!d.activities.family){
      d.activities.family=d.activities.sport;
      delete d.activities.sport;
    }
    return d;
  });
  const [device,setDevice]=useState('iphone');

  useEffect(()=>{
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify({step,data}));}catch{}
  },[step,data]);

  const go=n=>setStep(n);
  const next=()=>go(Math.min(step+1,6));
  const back=()=>go(Math.max(step-1,0));

  const isRealMobile=window.innerWidth<=480;
  const savedStep=saved?.step??0;

  const screenContent=(
    <div key={step} className={`screen-inner e${step>(saved?.step??-1)?'fwd':'bk'}`} style={{flex:1,display:'flex',flexDirection:'column',minHeight:0}}>
      {step===0&&<S1 data={data} setData={setData} onNext={next} savedStep={savedStep} onResume={()=>go(savedStep)}/>}
      {step===1&&<S2 data={data} setData={setData} onNext={next}/>}
      {step===2&&<S3 data={data} setData={setData} onNext={next}/>}
      {step===3&&<S4 data={data} setData={setData} onNext={next}/>}
      {step===4&&<S5 data={data} setData={setData} onNext={next}/>}
      {step===5&&<S6 data={data} setData={setData} onGenerate={next}/>}
      {step===6&&<S7 data={data} onFinish={()=>{try{localStorage.removeItem(STORAGE_KEY);}catch{}go(0);}}/>}
    </div>
  );

  if(isRealMobile){
    return(
      <div style={{width:'100vw',height:'100svh',background:'var(--bg)',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{height:'env(safe-area-inset-top,0px)',flexShrink:0}}/>
        {step<6&&<TopBar step={step} onBack={back}/>}
        <div style={{flex:1,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}}>{screenContent}</div>
      </div>
    );
  }

  return(
    <div style={{width:'100%',height:'100%',display:'flex',flexDirection:'column'}}>
      <DeviceBar active={device} onChange={setDevice}/>
      <ScaledFrame device={device}>
        <PhoneFrame device={device}>
          {step<6&&<TopBar step={step} onBack={back}/>}
          <div style={{flex:1,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}}>{screenContent}</div>
        </PhoneFrame>
      </ScaledFrame>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
